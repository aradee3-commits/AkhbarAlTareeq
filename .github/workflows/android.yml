name: Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Download offline Arabic voice and Sherpa runtime
        run: |
          mkdir -p app/libs app/src/main/assets/kareem
          curl -fL --retry 3 "https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-2.0.1.aar" -o app/libs/sherpa-onnx-2.0.1.aar
          curl -fL --retry 3 "https://huggingface.co/rhasspy/piper-voices/resolve/main/ar/ar_JO/kareem/medium/ar_JO-kareem-medium.onnx" -o app/src/main/assets/kareem/ar_JO-kareem-medium.onnx
          curl -fL --retry 3 "https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/ar/ar_JO/kareem/medium/ar_JO-kareem-medium.onnx.json" -o app/src/main/assets/kareem/ar_JO-kareem-medium.onnx.json
          echo "9e95cab07b679da603bba17c4dec7ab3111320571964ee95c0379603c086491e  app/src/main/assets/kareem/ar_JO-kareem-medium.onnx" | sha256sum -c -
          test -s app/src/main/assets/kareem/ar_JO-kareem-medium.onnx.json
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AkhbarAlTareeq-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
